; Loopback transport: keep the existing Android transport unchanged.
[transport-livekit-local]
type=transport
protocol=udp
bind=127.0.0.1:5062

[livekit-local]
type=endpoint
transport=transport-livekit-local
context=deny-inbound
disallow=all
allow=ulaw,alaw
aors=livekit-local
direct_media=no
media_address=127.0.0.1
bind_rtp_to_media_address=yes
rtp_symmetric=yes
dtmf_mode=rfc4733

[livekit-local]
type=aor
contact=sip:127.0.0.1:5060
