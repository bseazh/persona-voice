; Dedicated AI call entry, restricted to the user's current test recipient.
[sim-ai-outbound]
exten => 13660199577,1,Set(TIMEOUT(absolute)=180)
 same => n,Dial(${PJSIP_DIAL_CONTACTS(k60-test)},35,b(test-headers^s^1))
 same => n,Hangup()

; Used after the allowlisted SIM recipient answers.
[livekit-ai]
exten => s,1,Set(TIMEOUT(absolute)=180)
 same => n,Set(CALLERID(num)=1000)
 same => n,Dial(PJSIP/9000@livekit-local,30)
 same => n,Hangup()

; Server-only smoke call: no SIM is dialed.
[livekit-ai-smoke]
exten => s,1,Answer()
 same => n,Wait(8)
 same => n,Playback(custom/persona-sip-test)
 same => n,Wait(15)
 same => n,Hangup()
