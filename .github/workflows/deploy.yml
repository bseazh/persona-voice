name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: persona-voice-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Run API tests
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r services/api/requirements-dev.txt

      - name: Test API
        run: pytest -q

      - name: Audit frontend dependencies
        run: npm audit --omit=dev
        working-directory: web

      - name: Build and publish production image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}" .
          docker push "ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_SHA}"

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/persona_voice_deploy
          chmod 600 ~/.ssh/persona_voice_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync source
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i ~/.ssh/persona_voice_deploy -o IdentitiesOnly=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /home/ubuntu/Project/persona-voice'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='data/' \
            --exclude='persona-voice-*.tar.gz' \
            -e "$SSH" ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/Project/persona-voice/"

      - name: Activate release and verify health
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -i ~/.ssh/persona_voice_deploy -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin >/dev/null && \
             bash /home/ubuntu/Project/persona-voice/scripts/deploy-server.sh '${GITHUB_SHA}'; \
             status=\$?; sudo docker logout ghcr.io >/dev/null; exit \$status"

      - name: Verify public HTTPS endpoint
        run: curl --fail --show-error --silent --retry 5 --retry-delay 2 https://phone.hehaizhao.site/api/health
