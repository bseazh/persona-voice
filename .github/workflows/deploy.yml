name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: persona-voice-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Agent source
        run: python -m compileall -q services/agent

      - name: Test speculative transcript lifecycle
        run: python -m unittest discover -s tests -p 'test_preflight.py' -v

      - name: Test private phone console safeguards
        run: python -m unittest discover -s tests -p 'test_phone_*.py' -v

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: Audit frontend dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web

      - name: Lint frontend
        run: npm run lint
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/persona_voice_deploy
          chmod 600 ~/.ssh/persona_voice_deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          SSH="ssh -i ~/.ssh/persona_voice_deploy -o IdentitiesOnly=yes"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /home/ubuntu/Project/persona-voice'
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env' \
            --exclude='.env.local' \
            --exclude='.venv*/' \
            --exclude='web/node_modules/' \
            --exclude='web/.next/cache/' \
            --exclude='vendor/' \
            --exclude='data/' \
            --exclude='BigApple输出/' \
            -e "$SSH" ./ "$DEPLOY_USER@$DEPLOY_HOST:/home/ubuntu/Project/persona-voice/"

      - name: Activate release
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/persona_voice_deploy -o IdentitiesOnly=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /home/ubuntu/Project/persona-voice/scripts/deploy-server.sh '${GITHUB_SHA}'"

      - name: Verify public HTTPS endpoint
        run: curl --fail --show-error --silent --retry 8 --retry-delay 3 https://phone.hehaizhao.site/api/token
